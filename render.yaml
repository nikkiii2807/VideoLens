services:
  - type: web
    name: videolens-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DEBUG
        value: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://video-lens-dw4d.vercel.app
      - key: MAX_FILE_SIZE_MB
        value: 50
      - key: SAMPLING_FPS
        value: "2.0"
